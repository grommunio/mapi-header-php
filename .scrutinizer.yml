# package mirror: https://php-package-mirror.scrutinizer-ci.com/$VER.tar.bz2 
filter:
  excluded_paths:
    - tests/
    - dev/generate_*.php
    - .php-cs-fixer.dist.php
    - rector.php
  dependency_paths:
    - dev/php-mapi-stub.php
    - vendor/
build:
  image: default-bionic
  environment:
    php:
      version: 8.3.3
      ini:
        xdebug.mode: coverage
  nodes:
    analysis:
      project_setup:
        override:
          - mkdir -p tools
          - curl --fail --location https://phar.phpunit.de/phpunit-11.5.56.phar -o tools/phpunit.phar
      tests:
        override:
          - php tools/phpunit.phar --configuration phpunit.xml
          - php-scrutinizer-run --enable-security-analysis
          - command: phpcs-run
            use_website_config: true
checks:
  php:
    code_rating: true
    duplication: true
    excluded_dependencies:
      - phpunit/phpunit
tools:
  php_cs_fixer:
    config: .phpcs
